[package]
name = "hearth-core"
description = "Hearth's app logic: settings, model runtime, chat, coding agent, tools and storage. No Tauri dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
async-stream = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
similar = { workspace = true }
strsim = { workspace = true }
encoding_rs = { workspace = true }
chardetng = { workspace = true }
dunce = { workspace = true }
serde_path_to_error = { workspace = true }
# Job Objects (child process trees), the Git for Windows registry entry, OEM code pages.
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
hearth-testkit = { workspace = true }

[lints]
workspace = true
