[workspace]
resolver = "3"
members = ["crates/*", "apps/*/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# One Tauri 2 release, pinned exactly (Tauri 3 is still alpha). Bump deliberately.
tauri = { version = "=2.12.5", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# Must stay on the versions Tauri's webview layer (wry) uses; check with
# `cargo tree -i webview2-com` after any Tauri bump.
webview2-com = "0.39"
windows = "0.62"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "process", "signal"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"
async-stream = "0.3"
# Windows' own TLS (SChannel) instead of rustls + aws-lc, which would need CMake and NASM.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "stream", "gzip", "brotli"] }
# Bundled SQLite (with FTS5), so every PC runs the same, known SQLite.
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
tracing = "0.1"
# Agent tools: gitignore-aware walking and matching (ripgrep's crates), diffs, encodings, paths.
ignore = "0.4"
globset = "0.4"
regex = "1"
similar = "3"
strsim = "0.11"
encoding_rs = "0.8"
chardetng = "1"
dunce = "1"
serde_path_to_error = "0.1"
axum = "0.8"
pretty_assertions = "1"

hearth-core = { path = "crates/hearth-core" }
hearth-testkit = { path = "crates/hearth-testkit" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# See clippy.toml: child processes go through hearth_core::proc.
disallowed_methods = "deny"

# Size-optimised release builds (Cargo only honours profiles in the workspace root).
# Panics unwind, so a bug in one tool or task can't take the whole app down.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
