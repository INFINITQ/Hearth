[workspace]
resolver = "3"
members = ["crates/*", "apps/*/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# One Tauri 2 release, pinned exactly (Tauri 3 is still alpha). Bump deliberately.
tauri = { version = "=2.12.5", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# Must stay on the versions Tauri's webview layer (wry) uses; check with
# `cargo tree -i webview2-com` after any Tauri bump.
webview2-com = "0.39"
windows = "0.62"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

hearth-core = { path = "crates/hearth-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# See clippy.toml: child processes go through hearth_core::proc.
disallowed_methods = "deny"

# Size-optimised release builds (Cargo only honours profiles in the workspace root).
# Panics unwind, so a bug in one tool or task can't take the whole app down.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
